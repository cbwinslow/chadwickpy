name: Bug report
description: chadwickpy crashed or did something wrong.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: { required: true }
  - type: textarea
    id: command
    attributes:
      label: The exact command (or code) you ran
      render: shell
    validations: { required: true }
  - type: textarea
    id: output
    attributes:
      label: Output or error message
      render: text
  - type: input
    id: version
    attributes:
      label: chadwickpy version and Python version
      placeholder: "0.1.0, Python 3.12, Linux"
    validations: { required: true }
