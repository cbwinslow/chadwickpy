name: Docs problem
description: Something on the website is wrong, unclear or missing.
labels: [documentation]
body:
  - type: input
    id: page
    attributes:
      label: Which page?
      placeholder: https://cbwinslow.github.io/chadwickpy/getting-started/
    validations: { required: true }
  - type: textarea
    id: what
    attributes:
      label: What is wrong or missing?
    validations: { required: true }
