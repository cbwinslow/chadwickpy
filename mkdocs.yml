site_name: chadwickpy
site_description: Pure-Python port of the Chadwick baseball tools (cwevent, cwgame, cwdaily, cwsub, cwcomment, cwbox). Turn Retrosheet play-by-play files into data tables.
site_url: https://cbwinslow.github.io/chadwickpy/
repo_url: https://github.com/cbwinslow/chadwickpy
repo_name: cbwinslow/chadwickpy
edit_uri: edit/main/docs/
copyright: >-
  chadwickpy is independent of Chadwick and Retrosheet. GPL-3.0-or-later.
  <a href="https://github.com/cbwinslow/chadwickpy/issues/new?template=docs.yml">Report a problem with this page</a>
theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github
  features:
    - content.action.edit
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.tabs.link
    - search.suggest
    - toc.follow
extra_css:
  - stylesheets/extra.css
extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/cbwinslow/chadwickpy
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/chadwickpy/
plugins:
  - search
  - git-revision-date-localized:
      enable_creation_date: false
      type: date
      fallback_to_build_date: true
  - gen-files:
      scripts:
        - docs/gen_reference.py
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            show_root_heading: true
            docstring_style: google
  - llmstxt:
      full_output: llms-full.txt
      markdown_description: >-
        chadwickpy is a pure-Python port of the Chadwick baseball tools (cwevent, cwgame,
        cwdaily, cwsub, cwcomment, cwbox). It converts Retrosheet play-by-play event files into
        CSV tables. Install with pip install chadwickpy. It follows the official Chadwick 0.11.0 exactly (including the -Q quiet switch and -D directory option) and its output matches the C tools byte for byte on every Retrosheet season with game data, 1897-2025, for inputs where the C behaves in a defined way. It uses several CPU cores by itself (-j or CHADWICK_JOBS to control).
      sections:
        Start here:
          - index.md: what chadwickpy is and a one-minute example
          - getting-started.md: install, get Retrosheet data, first command
        Guides:
          - guides/event-data.md: cwevent columns, event codes and filters
          - guides/games-and-players.md: cwgame and cwdaily
          - guides/subs-and-comments.md: cwsub and cwcomment
          - guides/box-scores.md: cwbox
          - guides/python-api.md: use it from Python
          - guides/recipes.md: worked examples
          - guides/parallel.md: using several cores, -j, CHADWICK_JOBS, containers
        About:
          - about/who-is-it-for.md: who it suits and when to use something else
          - about/compared-with-chadwick.md: differences, speed, licence
          - about/alternatives.md: other ways to work with Retrosheet data
          - about/verification.md: how output was verified (seasons, fields, options, coverage)
          - about/coverage-matrix.md: which of Chadwick's C functions are ported
          - about/faq.md: frequently asked questions
          - about/changelog.md: release history
          - DECISIONS.md: design decisions (ADRs)
nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Guides:
      - Event data (cwevent): guides/event-data.md
      - Games and players: guides/games-and-players.md
      - Substitutions and comments: guides/subs-and-comments.md
      - Box scores: guides/box-scores.md
      - Python API: guides/python-api.md
      - Recipes: guides/recipes.md
      - Using several cores: guides/parallel.md
  - Reference:
      - reference/index.md
      - cwevent: reference/cwevent.md
      - cwgame: reference/cwgame.md
      - cwdaily: reference/cwdaily.md
      - cwsub: reference/cwsub.md
      - cwcomment: reference/cwcomment.md
      - cwbox: reference/cwbox.md
      - Python library: reference/library.md
  - About:
      - Who is it for?: about/who-is-it-for.md
      - Compared with Chadwick: about/compared-with-chadwick.md
      - Other tools: about/alternatives.md
      - How it was verified: about/verification.md
      - Coverage of Chadwick's code: about/coverage-matrix.md
      - Design decisions: DECISIONS.md
      - FAQ: about/faq.md
      - Changelog: about/changelog.md
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight
  - pymdownx.snippets:
      check_paths: true
exclude_docs: |
  gen_reference.py
