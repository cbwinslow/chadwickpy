site_name: chadwickpy
site_description: Pure-Python port of the Chadwick baseball tools (cwevent, cwgame, cwdaily, cwsub, cwcomment, cwbox).
site_url: https://cbwinslow.github.io/chadwickpy/
repo_url: https://github.com/cbwinslow/chadwickpy
repo_name: cbwinslow/chadwickpy
edit_uri: edit/main/docs/
theme:
  name: material
  features: [navigation.sections, content.code.copy, search.suggest]
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            docstring_style: google
nav:
  - Home: index.md
  - Install and use: usage.md
  - Tools: tools.md
  - Library: library.md
  - How it was verified: verification.md
  - Changelog: changelog.md
markdown_extensions:
  - admonition
  - toc: { permalink: true }
